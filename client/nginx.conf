server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Item photos are capped at 2 MB by the API; leave room for the other form fields.
  client_max_body_size 3m;

  location /api/ {
    proxy_pass http://server:5050;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://server:5050;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths fall back to index.html for React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
