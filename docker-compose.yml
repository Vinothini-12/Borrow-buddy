# Dedicated Postgres for BorrowBuddy only. Data lives in the named volume below.
services:
  db:
    image: postgres:16-alpine
    container_name: borrowbuddy-db
    environment:
      POSTGRES_USER: borrowbuddy
      POSTGRES_PASSWORD: borrowbuddy
    ports:
      - "5433:5432"
    volumes:
      - borrowbuddy_pgdata:/var/lib/postgresql/data
volumes:
  borrowbuddy_pgdata:
